name: Build and publish RWP
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s scripts/tests -v
      - name: Refresh public weather and gauges
        run: python scripts/refresh_weather.py
      - run: npm run data:validate
      - run: npm run build
        env:
          RWP_BASE_PATH: /RailwayWeatherPrediction/
          VITE_REPOSITORY_URL: https://github.com/orgonag/RailwayWeatherPrediction
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
