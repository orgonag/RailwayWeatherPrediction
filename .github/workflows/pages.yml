name: Build and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s scripts/tests -v
      - name: Refresh public weather
        run: python scripts/refresh_weather.py
      - name: Refresh actual station temperatures and bounded daily history
        run: python scripts/refresh_temperature_observations.py --history
      - name: Refresh public map layers and snowpack
        run: python scripts/refresh_map_layers.py
      - name: Refresh corridor gauges, basins and station history
        run: python scripts/refresh_water_coverage.py
      - run: npm run data:validate
      - run: npm run build:all
        env:
          RWP_BASE_PATH: /RailwayWeatherPrediction/
          VITE_REPOSITORY_URL: https://github.com/orgonag/RailwayWeatherPrediction
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist
      - name: Pages setup required
        if: steps.pages.outcome != 'success'
        run: |
          echo '::notice::Build verified. Enable Settings > Pages > Source > GitHub Actions, then rerun this workflow. No extra repository variable is required.'
  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
